<!DOCTYPE html>
<html>
	<head>
		<title> CSS grid </title>
<style>

.container{
	display:grid;
	grid-template columns: 1fr 1fr 1fr;
	gap:20px;
}

.box{
	padding:30px;
	background-color:blue;
	border:2px solid black;
	text-align:center;
}

</style>
	</head>
	<body>
		<h1> My skills</h1>
		<div class="container">
			<div class="box"> HTML </div>
			<div class="box"> CSS </div>
			<div class="box"> Javascript </div>
	</body>
</html>
