<!DOCTYPE html
<html>
	<head>
		<title> CSS position </title>
<style>

.container
	{
	width:150px;
	height:100px;
	background-color:lightblue;
	border:2px solid black;
	position:static;
}

.box
	{
	width:150px;
	height:100px;
	background-color:orange;
	border:3px solid brown;
	position:absolute;
	bottom:20px;
	left:20px;
}

</style>
	</head>
	<body>
		<h1> CSS position </h1>
		<div class="container" > hello world </div>
			<div class="box"> Hello kaviya </div>
	</body>
</html>
