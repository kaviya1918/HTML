<!DOCTYPE html>
<html>
	<head>
		<title> Pseudo classes </title>
<style>

button{
	padding: 10px, 20px;
	background-color: lightblue;
	border:2px solid black;
}

button:hover
	{
	background-color:black;
	color:white;
}

input:focus
	{
	border:3px solid black;
}

p:: first-letter {
	font-size:30px;
	font-weight:bold;
}

h1::before{
	content:"💻";
}

</style>
	</head>
	<body>
		<h1> My profile </h1>
				<p> I am learning css and javascript </p>
				<input type:"text" placeholder="Enter your name">
				<br> </br>
				<button> click me </button>
	</body>
</html>
