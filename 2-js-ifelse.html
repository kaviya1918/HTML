<!DOCTYPE html>
<html>
	<head>
		<title> JS if else </title>
		<script>
			let mark=92;
			if(mark>=90)
			{
				document.write ("Excellent");
			}
			else if(mark>=75)
			{
				document.write ("Very good");
			}
			else if (mark>=50)
			{
				document.write ("pass");
			}
			else
			{
			        document.write ("fail");
			}
		</script>
	</head>
	<body>
		<h1> Javascript if else </h1>
	</body>
</html>
